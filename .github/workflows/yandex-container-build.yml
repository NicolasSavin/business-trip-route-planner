name: Build Yandex Container image

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - backend/**
      - .github/workflows/yandex-container-build.yml

permissions:
  contents: read

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    env:
      IMAGE: cr.yandex/${{ secrets.YC_REGISTRY_ID }}/business-trip-route-planner-backend
      YC_REGISTRY_ID: ${{ secrets.YC_REGISTRY_ID }}
      YC_SA_JSON_CREDENTIALS: ${{ secrets.YC_SA_JSON_CREDENTIALS }}
      YANDEX_RASP_API_KEY: ${{ secrets.YANDEX_RASP_API_KEY }}

    steps:
      - name: Check required secrets
        shell: bash
        run: |
          set +x
          if [[ -z "$YC_REGISTRY_ID" ]]; then
            echo "::error::Required GitHub secret YC_REGISTRY_ID is missing or empty."
            exit 1
          fi
          if [[ -z "$YC_SA_JSON_CREDENTIALS" ]]; then
            echo "::error::Required GitHub secret YC_SA_JSON_CREDENTIALS is missing or empty."
            exit 1
          fi
          if [[ -z "$YANDEX_RASP_API_KEY" ]]; then
            echo "::error::Required GitHub secret YANDEX_RASP_API_KEY is missing or empty."
            exit 1
          fi

      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Yandex Cloud CLI
        shell: bash
        run: |
          curl --fail --silent --show-error --location \
            https://storage.yandexcloud.net/yandexcloud-yc/install.sh | bash -s -- -i "$HOME/yandex-cloud" -n
          echo "$HOME/yandex-cloud/bin" >> "$GITHUB_PATH"

      - name: Authenticate with Yandex Container Registry
        shell: bash
        run: |
          key_file="$RUNNER_TEMP/yc-key.json"
          trap 'rm -f "$key_file"' EXIT
          printf '%s' "$YC_SA_JSON_CREDENTIALS" > "$key_file"
          chmod 600 "$key_file"
          yc config profile create ci
          yc config set service-account-key "$key_file"
          yc container registry configure-docker

      - name: Build image
        run: |
          docker build \
            --file backend/Dockerfile \
            --tag "$IMAGE:latest" \
            --tag "$IMAGE:${GITHUB_SHA}" \
            backend

      - name: Smoke test image
        shell: bash
        run: |
          set +x
          container_id="$(docker run --detach --publish 8080:8080 \
            --env TUTU_ENABLED=false \
            --env TUTU_PLAYWRIGHT_ENABLED=false \
            --env RZD_AVAILABILITY_ENABLED=false \
            --env YANDEX_RASP_API_KEY="$YANDEX_RASP_API_KEY" \
            --env APP_ENV=development \
            --env PORT=8080 \
            "$IMAGE:${GITHUB_SHA}")"

          cleanup() {
            status=$?
            if [[ $status -ne 0 ]]; then
              echo "Container logs:"
              docker logs "$container_id" || true
            fi
            docker rm --force "$container_id" >/dev/null 2>&1 || true
            exit "$status"
          }
          trap cleanup EXIT

          for attempt in {1..30}; do
            if curl --fail --silent --show-error http://127.0.0.1:8080/health; then
              echo
              exit 0
            fi
            sleep 1
          done
          echo "::error::Backend health check did not become ready within 30 seconds."
          exit 1

      - name: Push image tags
        run: |
          docker push "$IMAGE:latest"
          docker push "$IMAGE:${GITHUB_SHA}"

      - name: Remove credentials
        if: always()
        run: rm -f "$RUNNER_TEMP/yc-key.json"
